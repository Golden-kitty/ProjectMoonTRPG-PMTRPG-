name: table-integrity

on:
  push:
    branches: [main, hotFix, "Halcyon'edit"]
  pull_request:
    branches: [main, hotFix, "Halcyon'edit"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: table-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  table-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout source and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-site.txt
            requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Tests including deliberate corruption fixtures
        run: python -m unittest discover -s tests -v

      - name: Frozen source, structure, resources and review traceability
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          python scripts/check_table_integrity.py --base-ref "$BASE_SHA" --report output/ci/table-integrity.json

      - name: Build site from checked sources
        run: python scripts/build_site.py build

      - name: Check rendered table DOM against frozen inventory
        run: python scripts/validate_rendered_tables.py --report output/ci/rendered-table-audit.json

      - name: Retain machine evidence (not visual acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-integrity-${{ github.sha }}
          path: output/ci/
          if-no-files-found: warn
